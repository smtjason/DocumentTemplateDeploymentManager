name: Build XrmToolBox tool

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/XrmToolBox/DocumentTemplateDeploymentManager.csproj --configfile src/XrmToolBox/NuGet.Config

      - name: Build
        run: dotnet build src/XrmToolBox/DocumentTemplateDeploymentManager.csproj --configuration Release --no-restore

      - name: Upload plugin assembly
        uses: actions/upload-artifact@v4
        with:
          name: XrmToolBox.DocumentTemplateDeploymentManager
          path: src/XrmToolBox/bin/Release/net48/XrmToolBox.DocumentTemplateDeploymentManager.dll
